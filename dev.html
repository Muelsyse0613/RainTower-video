<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>荒漠里的造雨塔</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d191c; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #box { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: #efe5cf; }
  #stage { width: 100%; height: 100%; display: block; }
  #veil { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transition: opacity 1.6s ease; }
  #veil.gone { opacity: 0; pointer-events: none; }
  #enter { opacity: 0; transition: opacity 1.8s ease; border: 0; background: none; cursor: pointer; padding: 28px 40px; display: flex; flex-direction: column; align-items: center; gap: 18px;
    font-family: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", serif; font-size: clamp(12px, 1.25vw, 17px); letter-spacing: 0.5em; text-indent: 0.5em; color: #5d4a40; }
  #veil.ready #enter { opacity: 1; }
  #veil.again #enter { color: #cbbda6; }
  #enter svg { width: clamp(22px, 2.4vw, 34px); height: auto; animation: breathe 3.6s ease-in-out infinite; }
  #enter:hover svg { animation-duration: 1.8s; }
  #dot { position: absolute; width: 7px; height: 9px; border-radius: 60% 40% 55% 45%; background: #8c7868; animation: breathe 2.4s ease-in-out infinite; }
  #veil.ready #dot { display: none; }
  @keyframes breathe { 0%, 100% { opacity: 0.35; transform: translateY(0); } 50% { opacity: 0.95; transform: translateY(3px); } }
</style>
</head>
<body>
<div id="wrap"><div id="box">
  <canvas id="stage"></canvas>
  <div id="veil">
    <div id="dot"></div>
    <button id="enter" aria-label="点击开启声音与播放">
      <svg viewBox="0 0 40 52" fill="none"><path d="M20.4 3.2C15.6 13.8 6.2 21.6 6.6 33.4c.3 8.4 6.4 14.6 14 14.4 7.5-.2 13.2-6.6 12.8-14.9C32.9 21.4 24.8 13.2 20.4 3.2Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="58 3 30 2 40 4"/><path d="M13.4 33.6c.5 4 3 6.6 6.2 7.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity=".6"/></svg>
      <span>点击开启声音与播放</span>
    </button>
  </div>
</div></div>
<!--SCRIPTS-->
<script src="src/timeline.js"></script>
<script src="src/lib.js"></script>
<script src="src/world.js"></script>
<script src="src/tower.js"></script>
<script src="src/fox.js"></script>
<script src="src/fx.js"></script>
<script src="src/audio.js"></script>
<script src="src/main.js"></script>
<!--/SCRIPTS-->
</body>
</html>
